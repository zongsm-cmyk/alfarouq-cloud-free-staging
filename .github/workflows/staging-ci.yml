name: Free staging safety tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-effects-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lockfile dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test synthetic HTTP requests only
        run: npm test
